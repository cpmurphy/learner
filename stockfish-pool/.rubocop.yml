# Inherits the repository style. Paths in an inherited config are relative to
# the file that defines them, so the test exclusions are restated here for
# this directory's own test/ folder.
inherit_from: ../.rubocop.yml

Metrics/ClassLength:
  Exclude: ['test/**/*']
Metrics/ModuleLength:
  Exclude: ['test/**/*']
Metrics/MethodLength:
  Exclude: ['test/**/*']
Metrics/AbcSize:
  Exclude: ['test/**/*']
Metrics/BlockLength:
  Exclude: ['test/**/*']
Layout/LineLength:
  Exclude: ['test/**/*']
